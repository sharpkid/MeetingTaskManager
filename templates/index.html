<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>腾讯会议挂机任务管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-section, .list-section {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #1a73e8;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1a73e8;
        }
        .btn {
            padding: 10px 30px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #1a73e8;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1557b0;
        }
        .btn-refresh {
            background-color: #666;
            color: white;
            margin-left: 10px;
        }
        .btn-refresh:hover {
            background-color: #555;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table th, table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        table th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        table tr:hover {
            background-color: #f8f9fa;
        }
        .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-in_progress {
            background-color: #d4edda;
            color: #155724;
        }
        .status-ended {
            background-color: #f8d7da;
            color: #721c24;
        }
        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }
        .remaining {
            color: #1a73e8;
            font-weight: 600;
        }
        .empty-tip {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>腾讯会议挂机任务管理系统</h1>
        
        <div class="form-section">
            <div class="section-title">发布挂机任务</div>
            <form id="taskForm">
                <div class="form-group">
                    <label for="meeting_id">腾讯会议号</label>
                    <input type="text" id="meeting_id" name="meeting_id" placeholder="请输入腾讯会议号（支持数字、字母组合）" required>
                </div>
                <div class="form-group">
                    <label for="start_time">会议开始时间</label>
                    <input type="datetime-local" id="start_time" name="start_time" required>
                </div>
                <div class="form-group">
                    <label for="end_time">会议结束时间</label>
                    <input type="datetime-local" id="end_time" name="end_time" required>
                </div>
                <div class="form-group">
                    <label for="max_participants">挂机人数上限</label>
                    <input type="number" id="max_participants" name="max_participants" min="1" placeholder="请输入挂机人数上限" required>
                </div>
                <button type="submit" class="btn btn-primary">发布任务</button>
            </form>
            <div id="formMessage" class="message"></div>
        </div>
        
        <div class="list-section">
            <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
                <span>有效任务列表</span>
                <button class="btn btn-refresh" onclick="loadTasks()">刷新列表</button>
            </div>
            <div class="table-wrapper">
                <table id="taskTable">
                    <thead>
                        <tr>
                            <th>任务ID</th>
                            <th>腾讯会议号</th>
                            <th>开始时间</th>
                            <th>结束时间</th>
                            <th>总挂机人数</th>
                            <th>当前已挂机</th>
                            <th>剩余名额</th>
                            <th>任务状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody">
                    </tbody>
                </table>
            </div>
            <div id="emptyTip" class="empty-tip" style="display: none;">暂无有效任务</div>
        </div>
    </div>

    <script>
        document.getElementById('taskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            fetch('/api/create_task', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const messageEl = document.getElementById('formMessage');
                if (data.code === 200) {
                    messageEl.className = 'message success';
                    messageEl.textContent = data.msg;
                    this.reset();
                    loadTasks();
                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = data.msg;
                }
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, 3000);
            })
            .catch(error => {
                const messageEl = document.getElementById('formMessage');
                messageEl.className = 'message error';
                messageEl.textContent = '提交失败，请重试';
            });
        });

        function loadTasks() {
            fetch('/api/get_tasks')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('taskTableBody');
                const emptyTip = document.getElementById('emptyTip');
                
                if (data.code === 200 && data.data.length > 0) {
                    tbody.innerHTML = '';
                    emptyTip.style.display = 'none';
                    
                    data.data.forEach(task => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${task.task_id.substring(0, 8)}...</td>
                            <td>${task.meeting_id}</td>
                            <td>${task.start_time_display}</td>
                            <td>${task.end_time_display}</td>
                            <td>${task.max_participants}</td>
                            <td>${task.current_participants}</td>
                            <td class="remaining">${task.remaining}</td>
                            <td><span class="status status-${task.status}">${getStatusText(task.status)}</span></td>
                            <td><button class="btn btn-delete" onclick="deleteTask('${task.task_id}')">删除</button></td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = '';
                    emptyTip.style.display = 'block';
                }
            });
        }

        function getStatusText(status) {
            const statusMap = {
                'pending': '待开始',
                'in_progress': '进行中',
                'ended': '已结束'
            };
            return statusMap[status] || status;
        }

        function deleteTask(taskId) {
            if (!confirm('确定要删除此任务吗？')) {
                return;
            }
            
            const formData = new FormData();
            formData.append('taskId', taskId);
            
            fetch('/api/delete_task', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    alert('删除成功');
                    loadTasks();
                } else {
                    alert('删除失败: ' + data.msg);
                }
            })
            .catch(error => {
                alert('删除失败，请重试');
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadTasks();
            setInterval(loadTasks, 5000);
        });
    </script>
</body>
</html>
